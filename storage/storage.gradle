dependencies {
    api project(':artifacts')

    // Synchronous client only: the Apache HTTP client is enough, Netty is left out.
    implementation("software.amazon.awssdk:s3:$awsSdkVersion") {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
    }
    runtimeOnly "software.amazon.awssdk:apache-client:$awsSdkVersion"
    implementation "org.apache.tika:tika-core:$tikaVersion"
    implementation commonDependencies.'servlet-api'

    testImplementation commonDependencies.'spring-boot-starter-test'
}

tasks {
    processResources {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}