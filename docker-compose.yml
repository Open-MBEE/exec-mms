version: '3.8'

services:
  postgres:
    image: postgres:11-alpine
    environment:
        - POSTGRES_PASSWORD=test1234
        - POSTGRES_USER=mmsuser
        - POSTGRES_DB=mms
    ports:
      - 5432:5432

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.8.1
    environment:
      - "discovery.type=single-node"
    ports:
        - 9200:9200
        - 9300:9300

  s3:
      image: adobe/s3mock:5.2.3
      environment:
          - "COM_ADOBE_TESTING_S3MOCK_STORE_ROOT=/s3mockroot"
          - "COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT=true"
      ports:
          - 9000:9090

  mms:
    build: .
    container_name: mms
    hostname: mms
    environment:
        - "SPRING_PROFILES_ACTIVE=test"
        - "JDK_JAVA_OPTIONS=${MMS_JAVA_OPTIONS:--XX:MaxRAMPercentage=90.0}"
    depends_on:
        - postgres
        - elasticsearch
        - s3
    ports: 
        - 8080:8080