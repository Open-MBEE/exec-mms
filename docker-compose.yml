version: '3.8'

services:
  postgres:
    image: postgres:11-alpine
    environment:
        - POSTGRES_PASSWORD=test1234
        - POSTGRES_USER=mmsuser
        - POSTGRES_DB=mms
    ports:
      - 5432:5432

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.8.1
    environment:
      - "discovery.type=single-node"
    ports:
        - 9200:9200
        - 9300:9300

  minio:
      image: cgr.dev/chainguard/minio:latest
      environment:
          - "MINIO_ROOT_USER=admintest"
          - "MINIO_ROOT_PASSWORD=admintest"
      command: server /tmp/data
      ports:
          - 9000:9000

  mms:
    build: .
    container_name: mms
    hostname: mms
    environment:
        - "SPRING_PROFILES_ACTIVE=test"
        - "JDK_JAVA_OPTIONS=${MMS_JAVA_OPTIONS:--XX:MaxRAMPercentage=90.0}"
    depends_on:
        - postgres
        - elasticsearch
        - minio
    ports: 
        - 8080:8080