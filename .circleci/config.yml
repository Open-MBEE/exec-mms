version: 2.1
orbs:
    docker: circleci/docker@2.1.1
    sonarcloud: sonarsource/sonarcloud@4.0.0
executors:
  openjdk_executor:
    docker:
      - image: cimg/openjdk:17.0.3
    environment:
      _JAVA_OPTIONS: "-Xmx3g"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false"

commands:
  require_publishing_credentials:
    steps:
      - run:
          name: Require the publishing credentials
          command: |
            # Names only, never values.
            for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY GPG_PASSPHRASE; do
              if [ -z "${!name:-}" ]; then
                echo "Error: ${name} is not set; the 'Maven Central' context supplies it."
                exit 1
              fi
            done
  export_signing_key:
    steps:
      - run:
          name: Hand the signing key to Gradle
          command: |
            # The context may hold the key ASCII-armoured or base64-encoded on one line; Gradle needs it armoured.
            umask 077
            case "$GPG_PRIVATE_KEY" in
              *"-----BEGIN PGP PRIVATE KEY BLOCK-----"*) printf '%s\n' "$GPG_PRIVATE_KEY" > /tmp/signing-key.asc ;;
              *) printf '%s' "$GPG_PRIVATE_KEY" | tr -d ' \n' | base64 -d > /tmp/signing-key.asc ;;
            esac
            if ! grep -q -- '-----BEGIN PGP PRIVATE KEY BLOCK-----' /tmp/signing-key.asc; then
              echo "Error: GPG_PRIVATE_KEY is neither an armoured private key nor its base64 encoding."
              exit 1
            fi
            echo 'export ORG_GRADLE_PROJECT_signingKey="$(cat /tmp/signing-key.asc)"' >> "$BASH_ENV"
            echo 'export ORG_GRADLE_PROJECT_signingPassword="$GPG_PASSPHRASE"' >> "$BASH_ENV"

jobs:
  build_and_test:
    executor:
      name: docker/docker
    working_directory: /home/circleci/mms
    steps:
      # A full clone, because the scan job blames files from the persisted .git.
      - checkout:
          method: full

      - setup_remote_docker

      - run:
          name: "Create and start all services from the docker-compose configuration"
          command: |
            cp example/src/main/resources/application.properties.example ./example/src/main/resources/application.properties
            mkdir -p jacocoJars
            curl -L -o ./jacocoJars/jacocoagent.jar "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.agent/0.8.7/org.jacoco.agent-0.8.7-runtime.jar"
            curl -L -o ./jacocoJars/jacococli.jar "https://repo1.maven.org/maven2/org/jacoco/org.jacoco.cli/0.8.7/org.jacoco.cli-0.8.7-nodeps.jar"
            export MMS_JAVA_OPTIONS="-XX:MaxRAMPercentage=90.0 -javaagent:/mms/jacocoJars/jacocoagent.jar=destfile=/mms/jacocoOutput/jacoco-it.exec,output=file"
            docker-compose up --build -d
            docker run --network container:mms curlimages/curl --retry 8 --retry-delay 10 --retry-max-time 90 --retry-connrefused http://mms:8080/healthcheck
            docker run --network container:mms curlimages/curl --retry 20 --retry-delay 6 --retry-all-errors http://elasticsearch:9200

      - run:
          name: "Run and test Postman Collection"
          command: |
            docker create -v /etc/newman --name mms_test_configs alpine:3.4 /bin/true
            docker cp example/. mms_test_configs:/etc/newman
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run crud.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run getAtCommits.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run makeBranchFromCommit.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run cameo.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run jupyter.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run localauth.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run permissions.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run search.postman_collection.json -e test-env.json --delay-request 1000
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run artifacts.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run elastic.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run groups.postman_collection.json -e test-env.json --delay-request 500
            
            docker stop mms
            mkdir -p jacocoOutput
            docker cp mms:/mms/jacocoOutput/jacoco-it.exec ./jacocoOutput/jacoco-it.exec

      - run:
          name: "Run the search collections against OpenSearch"
          command: |
            docker-compose down -v
            docker-compose -f docker-compose.yml -f docker-compose.opensearch.yml up -d --scale elasticsearch=0
            docker run --network container:mms curlimages/curl --retry 8 --retry-delay 10 --retry-max-time 90 --retry-connrefused http://mms:8080/healthcheck
            docker run --network container:mms curlimages/curl --retry 20 --retry-delay 6 --retry-all-errors http://opensearch:9200
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run crud.postman_collection.json -e test-env.json --delay-request 500
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run search.postman_collection.json -e test-env.json --delay-request 1000
            docker run --volumes-from mms_test_configs --network container:mms -t postman/newman run elastic.postman_collection.json -e test-env.json --delay-request 500

      - persist_to_workspace:
            root: /home/circleci/
            paths:
                - mms/*

  scan:
      executor: openjdk_executor
      working_directory: /home/circleci/mms
      steps:
          - attach_workspace:
                at: ~/
          - run:
                name: Build classes to scan
                command: |
                    ./gradlew build -x test
                    mkdir -p TEMPORARYclassfiles
                    cp -r */build/classes/java/main/* TEMPORARYclassfiles/
                    java -jar jacocoJars/jacococli.jar report jacocoOutput/jacoco-it.exec --classfiles TEMPORARYclassfiles/ --xml ./jacocoOutput/jacocoXMLReport
                    rm -r TEMPORARYclassfiles

          - sonarcloud/scan

  # Publishing uses the organization's 'Maven Central' context: a Central Portal user token
  # (CENTRAL_TOKEN_USERNAME, CENTRAL_TOKEN_PASSWORD) and the release signing key
  # (GPG_PRIVATE_KEY, GPG_PASSPHRASE).
  deploy_snapshot:
      executor: openjdk_executor
      working_directory: /home/circleci/mms
      steps:
          - attach_workspace:
                at: ~/
          - require_publishing_credentials
          - export_signing_key
          - run:
                name: Deploy snapshot to the Central Portal snapshot repository
                command: |
                    export ORG_GRADLE_PROJECT_centralUsername="$CENTRAL_TOKEN_USERNAME"
                    export ORG_GRADLE_PROJECT_centralPassword="$CENTRAL_TOKEN_PASSWORD"
                    ./gradlew publish

  # A Maven Central version can never be replaced, so everything that can fail runs before the
  # upload: the credentials, the version check, and building and signing every module.
  deploy_release:
      executor: openjdk_executor
      working_directory: /home/circleci/mms
      steps:
          - attach_workspace:
                at: ~/
          - require_publishing_credentials
          - run:
                name: Refuse a version already on Maven Central
                command: |
                    code=$(curl -s -o /dev/null -w '%{http_code}' "https://repo1.maven.org/maven2/org/openmbee/mms/core/${CIRCLE_TAG}/")
                    case "$code" in
                      404) echo "org.openmbee.mms ${CIRCLE_TAG} is not on Maven Central yet" ;;
                      200) echo "Error: org.openmbee.mms ${CIRCLE_TAG} is already on Maven Central and cannot be replaced."; exit 1 ;;
                      *) echo "Error: could not ask Maven Central (HTTP $code); nothing was published."; exit 1 ;;
                    esac
          - export_signing_key
          - run:
                name: Build and sign the deployment bundle
                command: |
                    ./gradlew -PbuildNumber=$CIRCLE_BUILD_NUM -PbuildTag=$CIRCLE_TAG --stacktrace cleanCentralStaging centralBundle
                    bundle=build/central/central-bundle.zip
                    poms=$(unzip -Z1 "$bundle" | grep -c '\.pom$')
                    signed=$(unzip -Z1 "$bundle" | grep -c '\.pom\.asc$')
                    echo "$poms modules, $signed signed"
                    if [ "$poms" -eq 0 ] || [ "$poms" -ne "$signed" ]; then
                      echo "Error: the bundle is empty or not every module is signed; nothing was published."
                      exit 1
                    fi
          - run:
                name: Upload the bundle and wait until Maven Central publishes it
                no_output_timeout: 35m
                command: |
                    # The token travels in a curl config file, never on a command line.
                    auth=$(mktemp)
                    printf 'header = "Authorization: Bearer %s"\n' "$(printf '%s:%s' "$CENTRAL_TOKEN_USERNAME" "$CENTRAL_TOKEN_PASSWORD" | base64 -w0)" > "$auth"
                    api=https://central.sonatype.com/api/v1/publisher
                    code=$(curl -sS -K "$auth" -o /tmp/deployment-id -w '%{http_code}' \
                      --form bundle=@build/central/central-bundle.zip \
                      "$api/upload?publishingType=AUTOMATIC&name=mms-${CIRCLE_TAG}")
                    if [ "$code" != 201 ]; then
                      echo "Error: the Central Portal refused the upload (HTTP $code)."
                      cat /tmp/deployment-id
                      exit 1
                    fi
                    id=$(cat /tmp/deployment-id)
                    echo "Deployment $id uploaded"
                    for attempt in $(seq 1 180); do
                      status=$(curl -sS -K "$auth" -X POST "$api/status?id=$id" || true)
                      state=$(printf '%s' "$status" | jq -r '.deploymentState // empty' 2>/dev/null || true)
                      echo "$(date -u +%H:%M:%S) ${state:-no answer}"
                      case "$state" in
                        PUBLISHED) exit 0 ;;
                        FAILED) printf '%s\n' "$status"; exit 1 ;;
                      esac
                      sleep 10
                    done
                    echo "Error: deployment $id was not published within 30 minutes; check it at https://central.sonatype.com/publishing/deployments."
                    exit 1

workflows:
    version: 2
    build-test-deploy:
      jobs:
        - build_and_test:
              filters:
                  tags:
                      only: /[0-9.]+(-(a|b|rc)[0-9]+)?/
        - scan:
              requires:
                  - build_and_test
              filters:
                  tags:
                      only: /[0-9.]+(-(a|b|rc)[0-9]+)?/
              context:
                  - SonarCloud
        - deploy_snapshot:
              requires:
                  - build_and_test
              context:
                  - Maven Central
              filters:
                  branches:
                      only: /((release|hotfix|support)/[0-9.]+(-(a|b|rc)[0-9]+)?|develop)/
        - deploy_release:
              requires:
                  - build_and_test
              context:
                  - Maven Central
              filters:
                  tags:
                      only: /[0-9.]+(-(a|b|rc)[0-9]+)?/
                  branches:
                      ignore: /.*/